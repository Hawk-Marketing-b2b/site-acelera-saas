name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # permite re-deploy manual pela aba Actions

permissions:
  contents: write

# O Lovable faz vários commits seguidos. Sem isso, deploys rodam em paralelo e um
# build ANTIGO pode terminar depois e sobrescrever o novo no ar.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node fixo (antes era "bun latest": cada deploy podia rodar numa versão diferente)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm + registry público. O bun.lock gerado pelo Lovable aponta parte dos pacotes
      # para o cache privado do Lovable, que não é acessível fora da plataforma.
      # "npm install" (e não "npm ci") tolera quando o Lovable mexe no package.json
      # sem atualizar o package-lock.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Pré-renderiza cada página em HTML estático (ver vite.config.ts).
      # Se qualquer página quebrar no render, o build falha e NADA é publicado.
      - name: Build (static prerender)
        run: npm run build:static

      - name: Smoke test
        run: |
          set -e
          OUT=dist/client
          for page in index.html 404.html inbound-marketing/index.html performance/index.html \
                      web-design/index.html vendas/index.html comercial/index.html ia-e-automacao/index.html; do
            f="$OUT/$page"
            test -s "$f"                         || { echo "::error::faltando $f"; exit 1; }
            grep -q '<html'            "$f"      || { echo "::error::$f sem <html>"; exit 1; }
            grep -q 'rel="stylesheet" href="/assets/' "$f" || { echo "::error::$f sem CSS"; exit 1; }
            grep -q '/assets/.*\.js'   "$f"      || { echo "::error::$f sem JS"; exit 1; }
          done
          for page in index.html inbound-marketing/index.html performance/index.html; do
            grep -q '<h1' "$OUT/$page" || { echo "::error::$OUT/$page sem conteúdo pré-renderizado"; exit 1; }
          done
          echo "OK: $(find $OUT -name '*.html' | wc -l) páginas HTML"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
          cname: acelerasaas.com
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }} (${{ github.sha }})"
