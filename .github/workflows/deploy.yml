name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Generate index.html
        run: node scripts/generate-html.js

      - name: Detect publish directory
        run: |
          if [ -f dist/client/index.html ]; then
            echo "PUBLISH_DIR=./dist/client" >> "$GITHUB_ENV"
          elif [ -f dist/index.html ]; then
            echo "PUBLISH_DIR=./dist" >> "$GITHUB_ENV"
          elif [ -f .output/public/index.html ]; then
            echo "PUBLISH_DIR=./.output/public" >> "$GITHUB_ENV"
          elif [ -f .output/server/public/index.html ]; then
            echo "PUBLISH_DIR=./.output/server/public" >> "$GITHUB_ENV"
          elif [ -f build/client/index.html ]; then
            echo "PUBLISH_DIR=./build/client" >> "$GITHUB_ENV"
          elif [ -f build/index.html ]; then
            echo "PUBLISH_DIR=./build" >> "$GITHUB_ENV"
          else
            echo "Nenhuma pasta publicável encontrada"
            ls -la
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          cname: acelerasaas.com
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }} (${{ github.sha }})"
